<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CredAudit Report</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#101010;
      --nav:#060606;
      --bar:#1c1c1c;
      --panel:#252525;
      --panel-2:#2b2b2b;
      --ink:#f2f2f2;
      --muted:#a3a3a3;
      --faint:#777;
      --border:#3a3a3a;
      --border-hot:#43c9c8;
      --code:#141414;
      --chip:#2a2a2a;
      --table-bg:#191b1d;
      --table-bg-2:#202326;
      --table-head:#272a2d;
      --table-border:#3f454b;
      --table-ink:#f2f4f5;
      --table-muted:#a9b0b6;
      --table-code:#111315;
      --green:#43c9c8;
      --steel:#43c9c8;
      --orange:#ff8733;
      --amber:#ffd24a;
      --red:#ff4057;
      --radius:3px;
      --shadow:none;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--sans);
      font-size:14px;
      line-height:1.4;
    }
    body::after{
      display:none;
    }
    a{color:inherit}
    button,input,select{font:inherit}
    .shell{position:relative;z-index:1;min-height:100vh;padding:0;display:grid;gap:0;align-content:start;background:#101010}
    .contextBar{
      min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:12px;
      background:#1f1f1f;border-bottom:1px solid #343434;padding:6px 14px;color:#d7d7d7;font-size:12px
    }
    .crumb{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
    .crumb strong{color:#fff;font-weight:700}
    .timeSelect{
      display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border:1px solid #464646;
      background:#2a2a2a;color:#ececec;border-radius:2px;font-family:var(--mono);font-size:11px
    }
    .contextMeta{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted)}
    .commandBar{
      display:grid;
      grid-template-columns:minmax(240px,1fr) auto;
      gap:14px;
      align-items:center;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
      padding:10px 12px;
      margin:14px 14px 12px;
    }
    .brandBlock{display:flex;gap:12px;align-items:center;min-width:0}
    .mark{
      width:38px;height:34px;border-radius:2px;border:1px solid #4b4b4b;
      display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:#f4f4f4;
      background:#181818;
      letter-spacing:0;
    }
    .brandText{min-width:0}
    .titleLine{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    h1{margin:0;font-size:17px;font-weight:700;letter-spacing:0;color:#f4f4f4}
    .version,.modeBadge,.timeBadge{
      display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;border-radius:4px;
      border:1px solid #474747;background:#181818;font-family:var(--mono);font-size:12px;color:var(--muted)
    }
    .modeBadge.safe{color:var(--green);border-color:rgba(67,201,200,.52)}
    .modeBadge.raw{color:var(--amber);border-color:rgba(251,191,36,.42)}
    .byline{margin-top:3px;color:var(--muted);font-size:12px}
    .byline a{color:var(--green);text-decoration:none}
    .byline a:hover{text-decoration:underline}
    .metricGrid{display:grid;grid-template-columns:repeat(5,minmax(82px,1fr));gap:6px;min-width:520px}
    .metric{
      border:1px solid #404040;border-left:3px solid var(--green);border-radius:2px;padding:8px 10px;background:#2a2a2a;
      box-shadow:none;min-height:58px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px
    }
    .metric span{display:block;color:#d0d0d0;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .metric strong{display:block;font-family:var(--mono);font-size:28px;line-height:1;font-weight:700;color:#fff;text-align:right}
    .metric.critical{border-left-color:var(--red)}
    .metric.high{border-left-color:var(--orange)}
    .metric.medium{border-left-color:var(--amber)}
    .metric.low{border-left-color:var(--steel)}
    .metric.critical strong{color:var(--red)}
    .metric.high strong{color:var(--orange)}
    .metric.medium strong{color:var(--amber)}
    .metric.low strong{color:var(--steel)}
    .mainGrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start;padding:0 14px 14px}
    .sidebar,.workbench{
      border:1px solid var(--border);border-radius:var(--radius);
      background:var(--panel);
      box-shadow:var(--shadow);
    }
    .sidebar{position:sticky;top:14px;padding:12px;display:grid;gap:14px}
    .filterSection{display:grid;gap:8px}
    .sectionLabel{
      color:#cfcfcf;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
      display:flex;align-items:center;justify-content:space-between
    }
    .chipGroup{display:flex;flex-wrap:wrap;gap:7px;max-height:150px;overflow:auto;padding-right:2px}
    .chipBtn,.btn,.iconBtn{
      border:1px solid var(--border);border-radius:4px;background:var(--chip);color:var(--ink);
      min-height:31px;padding:6px 9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;
      text-decoration:none;white-space:nowrap;box-shadow:none
    }
    .chipBtn{font-size:12px;max-width:100%}
    .chipBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .chipBtn.active{border-color:var(--border-hot);background:#263c3c;box-shadow:inset 3px 0 0 rgba(67,201,200,.85)}
    .chipBtn[data-severity="Critical"].active{border-color:rgba(239,38,38,.62);color:#ffd7d7;box-shadow:inset 3px 0 0 rgba(239,38,38,.72)}
    .chipBtn[data-severity="High"].active{border-color:rgba(249,115,22,.58);color:#ffe0c2;box-shadow:inset 3px 0 0 rgba(249,115,22,.72)}
    .chipBtn[data-severity="Medium"].active{border-color:rgba(214,162,31,.58);color:#f6e4a6;box-shadow:inset 3px 0 0 rgba(214,162,31,.72)}
    .chipBtn[data-severity="Low"].active{border-color:rgba(56,189,248,.50);color:#d3edff;box-shadow:inset 3px 0 0 rgba(56,189,248,.66)}
    .btn:hover,.iconBtn:hover,.chipBtn:hover{border-color:var(--border-hot);background:#303030}
    .field{display:grid;gap:6px}
    .field input,.searchBox,select{
      width:100%;border:1px solid var(--border);border-radius:4px;
      background:var(--code);color:var(--ink);min-height:34px;padding:8px 10px;outline:none
    }
    .field input:focus,.searchBox:focus,select:focus{border-color:var(--green);box-shadow:inset 0 -2px 0 rgba(67,201,200,.8)}
    .rangeRow{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center}
    input[type="range"]{accent-color:var(--green)}
    .scoreReadout{font-family:var(--mono);color:var(--green);text-align:right}
    .workbench{padding:12px;min-width:0;background:#202020}
    .toolbar{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}
    .toolbarActions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .selectWrap{display:inline-flex;align-items:center;gap:8px;color:#d0d0d0;font-size:12px}
    .selectWrap select{width:auto;min-height:32px;padding:6px 26px 6px 8px}
    .tableFrame{
      border:1px solid var(--table-border);border-radius:var(--radius);overflow:auto;
      background:var(--table-bg);max-height:calc(100vh - 215px);min-height:420px
    }
    table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;color:var(--table-ink)}
    col.sev{width:112px}
    col.file{width:31%}
    col.rule{width:190px}
    col.score{width:118px}
    col.value{width:150px}
    col.line{width:72px}
    col.context{width:30%}
    thead th{
      position:sticky;top:0;z-index:2;background:var(--table-head);color:#d7dde3;
      border-bottom:1px solid var(--table-border);padding:9px 8px;text-align:left;font-size:11px;
      text-transform:uppercase;letter-spacing:.08em
    }
    .sortButton{
      border:0;background:transparent;color:inherit;padding:0;cursor:pointer;display:inline-flex;gap:5px;align-items:center;
      text-transform:inherit;letter-spacing:inherit;font-size:inherit
    }
    tbody tr.resultRow{cursor:pointer}
    tbody tr.resultRow:hover{background:rgba(148,163,184,.075)}
    tbody td{border-bottom:1px solid var(--table-border);padding:8px 8px;vertical-align:middle}
    .detailRow[hidden]{display:none}
    .detailCell{padding:0 8px 10px 120px;background:#14181c}
    .detailPanel{
      border:1px solid var(--table-border);border-radius:var(--radius);padding:10px;
      background:#101317;display:grid;gap:8px
    }
    .detailGrid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:7px 12px;font-size:12px}
    .detailGrid dt{color:var(--table-muted);margin:0;text-transform:uppercase;letter-spacing:.08em}
    .detailGrid dd{margin:0;min-width:0;word-break:break-word}
    .mono{font-family:var(--mono)}
    .severityBadge,.rulePill{
      display:inline-flex;align-items:center;max-width:100%;border-radius:3px;border:1px solid var(--table-border);
      padding:3px 8px;font-size:12px;line-height:1.2
    }
    .severityBadge{font-family:var(--mono)}
    .sev-Critical .severityBadge{border-color:rgba(239,38,38,.72);color:#ffdada;background:rgba(239,38,38,.045)}
    .sev-High .severityBadge{border-color:rgba(249,115,22,.66);color:#ffdfc2}
    .sev-Medium .severityBadge{border-color:rgba(214,162,31,.66);color:#f6e4a6}
    .sev-Low .severityBadge{border-color:rgba(56,189,248,.58);color:#d2edff}
    .fileName{font-family:var(--mono);font-weight:700;color:#f3f4f6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .filePath{font-family:var(--mono);font-size:11px;color:var(--table-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
    .rulePill{font-family:var(--mono);font-size:11px;color:#e5e7eb;background:#171b20;border-color:#444c55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .scoreCell{display:grid;gap:4px}
    .scoreTop{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono)}
    .scoreRail{height:5px;border-radius:2px;background:#20252a;overflow:hidden;border:1px solid #3a424a}
    .scoreRail span{display:block;height:100%;width:0;background:var(--green);border-radius:1px}
    .sev-Critical .scoreRail span{background:var(--red)}
    .sev-High .scoreRail span{background:var(--orange)}
    .sev-Medium .scoreRail span{background:var(--amber)}
    .sev-Low .scoreRail span{background:var(--steel)}
    code.val,code.ctx{
      display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-family:var(--mono);background:var(--table-code);border:1px solid #313840;
      border-radius:3px;padding:4px 6px;color:#f1f5f9
    }
    .lineNo{font-family:var(--mono);color:var(--table-muted)}
    .rowTools{display:flex;gap:6px;margin-top:6px;opacity:0;transition:opacity .12s}
    tr:hover .rowTools{opacity:1}
    .iconBtn{min-height:26px;padding:4px 7px;font-size:11px}
    .footerBar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
    .pager{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .statusLine{font-size:12px;color:var(--muted)}
    .toast{
      position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
      border:1px solid var(--border-hot);border-radius:var(--radius);background:#08100b;color:var(--ink);
      padding:9px 12px;font-size:12px;box-shadow:0 8px 18px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:opacity .18s;z-index:9
    }
    .toast.show{opacity:1}
    .safe-report .rawOnly{display:none}
    @media (max-width:1100px){
      .contextBar{align-items:flex-start;flex-direction:column}
      .commandBar{grid-template-columns:1fr}
      .metricGrid{min-width:0;grid-template-columns:repeat(5,minmax(0,1fr))}
      .mainGrid{grid-template-columns:1fr}
      .sidebar{position:static}
      .tableFrame{max-height:none}
      .toolbar{grid-template-columns:1fr}
      .toolbarActions{justify-content:flex-start}
    }
    @media (max-width:720px){
      .shell{padding:0}
      .commandBar{margin:10px}
      .mainGrid{padding:0 10px 10px}
      .metricGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .metric:first-child{grid-column:1/-1}
      .metric{grid-template-columns:1fr;align-items:start;min-height:64px}
      .metric strong{text-align:left;font-size:24px;margin-top:4px}
      .brandBlock{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:flex-start}
      .titleLine{display:grid;grid-template-columns:1fr;justify-items:start;align-items:flex-start}
      .byline{display:flex;flex-wrap:wrap;gap:6px}
      .contextBar{padding:8px 10px}
      .crumb{white-space:normal;flex-wrap:wrap}
      .toolbarActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
      .toolbarActions .btn,.toolbarActions .selectWrap{width:100%;justify-content:center}
      .selectWrap select{min-width:0;width:100%}
      col.file{width:260px}
      col.context{width:260px}
      .commandBar,.sidebar,.workbench{border-radius:5px}
    }
    @media (max-width:460px){
      body{overflow-x:hidden}
      h1{font-size:18px}
      .version,.modeBadge,.timeBadge{font-size:11px}
      .toolbarActions{grid-template-columns:1fr}
    }
    @media print{
      body{background:#fff;color:#000}
      body::after,.sidebar,.toolbar,.footerBar{display:none}
      .shell{padding:0}
      .commandBar,.workbench,.tableFrame{box-shadow:none;border-color:#bbb;background:#fff}
      .tableFrame{max-height:none;overflow:visible}
      thead th{background:#eee;color:#000}
    }
  </style>
</head>

    const pager = document.getElementById('pager');
    const pageSize = document.getElementById('pageSize');
    const minScore = document.getElementById('minScore');
    const scoreOutput = document.getElementById('scoreOutput');
    const scoreReadout = document.getElementById('scoreReadout');
    const extGroup = document.getElementById('extGroup');
    const ruleGroup = document.getElementById('ruleGroup');
    const incGlob = document.getElementById('incGlob');
    const excGlob = document.getElementById('excGlob');
    const visibleCount = document.getElementById('visibleCount');
    const loadedCount = document.getElementById('loadedCount');
    const toggleRawBtn = document.getElementById('toggleRaw');
    const clearBtn = document.getElementById('clear');
    const exportFilteredBtn = document.getElementById('exportFiltered');

    let showRaw = false;
    let page = 1;
    let filtered = DATA.slice();
    let sortKey = 'severity';
    let sortDir = 'desc';
    const severityState = {Critical:true, High:true, Medium:true, Low:true};
    const sevRank = {Critical:4, High:3, Medium:2, Low:1};
    const extState = new Map();
    const ruleState = new Map();
    const htmlMap = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'};

    function esc(value){ return String(value == null ? '' : value).replace(/[&<>"']/g, c => htmlMap[c]); }
    function attr(value){ return esc(value); }
    function clampScore(value){ const n = parseInt(value || 0, 10); return Math.max(0, Math.min(99, Number.isFinite(n) ? n : 0)); }
    function fileName(path){ const parts = String(path || '').split(/[\\/]/); return parts[parts.length - 1] || String(path || ''); }
    function fileDir(path){ const p = String(path || ''); const n = fileName(p); return n && p.length > n.length ? p.slice(0, -n.length).replace(/[\\/]$/, '') : ''; }
    function debounce(fn, ms){ let timer; return function(){ clearTimeout(timer); timer = setTimeout(fn, ms); }; }
    function globToReg(glob){
      const escaped = String(glob || '').replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.');
      return new RegExp('^' + escaped + '$','i');
    }
    function fuzzy(hay, needle){
      hay = String(hay || '').toLowerCase();
      needle = String(needle || '').toLowerCase();
      if(!needle) return true;
      let j = 0;
      for(let i=0;i<hay.length && j<needle.length;i++){ if(hay[i] === needle[j]) j++; }
      return j === needle.length;
    }

    function makeChip(label, stateMap, key){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chipBtn active';
      btn.title = label;
      btn.innerHTML = '<span>' + esc(label) + '</span>';
      btn.addEventListener('click', () => {
        const next = !stateMap.get(key);
        stateMap.set(key, next);
        btn.classList.toggle('active', next);
        applyFilters();
      });
      return btn;
    }

    Array.from(new Set(DATA.map(f => {
      const m = String(f.file || '').toLowerCase().match(/\.([a-z0-9]+)$/);
      return m ? m[1] : '';
    }))).filter(Boolean).sort().forEach(ext => {
      extState.set(ext, true);
      extGroup.appendChild(makeChip('.' + ext, extState, ext));
    });

    Array.from(new Set(DATA.map(f => f.rule || ''))).filter(Boolean).sort().forEach(rule => {
      ruleState.set(rule, true);
      ruleGroup.appendChild(makeChip(rule, ruleState, rule));
    });

    document.querySelectorAll('[data-severity]').forEach(btn => {
      btn.addEventListener('click', () => {
        const sev = btn.dataset.severity;
        severityState[sev] = !severityState[sev];
        btn.classList.toggle('active', severityState[sev]);
        applyFilters();
      });
    });

    function compare(a,b){
      let va, vb;
      if(sortKey === 'severity'){ va = sevRank[a.severity] || 0; vb = sevRank[b.severity] || 0; }
      else if(sortKey === 'confidence'){ va = clampScore(a.confidence); vb = clampScore(b.confidence); }
      else if(sortKey === 'line'){ va = parseInt(a.line || 0, 10) || 0; vb = parseInt(b.line || 0, 10) || 0; }
      else { va = String(a[sortKey] || '').toLowerCase(); vb = String(b[sortKey] || '').toLowerCase(); }
      if(va === vb){
        const sa = clampScore(a.confidence), sb = clampScore(b.confidence);
        if(sa !== sb) return sb - sa;
        return String(a.file || '').localeCompare(String(b.file || ''));
      }
      const result = va > vb ? 1 : -1;
      return sortDir === 'asc' ? result : -result;
    }

    function applyFilters(){
      const term = q.value.trim();
      const scoreFloor = clampScore(minScore.value);
      const inc = incGlob.value.split(/[,\s]+/).filter(Boolean).map(globToReg);
      const exc = excGlob.value.split(/[,\s]+/).filter(Boolean).map(globToReg);
      scoreOutput.textContent = String(scoreFloor);
      scoreReadout.textContent = scoreFloor + '+';
      filtered = DATA.filter(f => {
        const sev = f.severity || 'Low';
        if(!severityState[sev]) return false;
        if(clampScore(f.confidence) < scoreFloor) return false;
        const fp = String(f.file || '');
        const extMatch = fp.toLowerCase().match(/\.([a-z0-9]+)$/);
        const ext = extMatch ? extMatch[1] : '';
        if(ext && extState.has(ext) && !extState.get(ext)) return false;
        const rule = f.rule || '';
        if(ruleState.has(rule) && !ruleState.get(rule)) return false;
        if(inc.length && !inc.some(rx => rx.test(fp))) return false;
        if(exc.some(rx => rx.test(fp))) return false;
        if(!term) return true;
        return fuzzy(fp, term) || fuzzy(rule, term) || fuzzy(f.redacted || f.match || '', term) || fuzzy(f.context || '', term);
      }).sort(compare);
      page = 1;
      render();
    }
    const applyFiltersDebounced = debounce(applyFilters, 160);

    function render(){
      const size = parseInt(pageSize.value, 10) || 500;
      const totalPages = Math.max(1, Math.ceil(filtered.length / size));
      if(page > totalPages) page = totalPages;
      const start = (page - 1) * size;
      const end = Math.min(filtered.length, start + size);
      const rows = [];
      for(let i=start;i<end;i++){
        const f = filtered[i] || {};
        const sev = f.severity || 'Low';
        const score = clampScore(f.confidence);
        const path = String(f.file || '');
        const name = fileName(path);
        const dir = fileDir(path);
        const value = showRaw && !SAFE_REPORT ? (f.match || '') : (f.redacted || '');
        const evidence = Array.isArray(f.evidence) ? f.evidence.join('; ') : String(f.evidence || '');
        const detailId = 'detail-' + i;
        rows.push(
          '<tr class="resultRow sev-' + esc(sev) + '" data-detail="' + detailId + '">' +
            '<td><span class="severityBadge">' + esc(sev) + '</span></td>' +
            '<td><div class="fileName" title="' + attr(path) + '">' + esc(name) + '</div><div class="filePath" title="' + attr(path) + '">' + esc(dir) + '</div></td>' +
            '<td><span class="rulePill" title="' + attr(f.rule || '') + '">' + esc(f.rule || '') + '</span></td>' +
            '<td><div class="scoreCell"><div class="scoreTop"><span>' + score + '%</span><span>' + esc(f.finding_class || '') + '</span></div><div class="scoreRail"><span style="width:' + score + '%"></span></div></div></td>' +
            '<td><code class="val" title="' + attr(value) + '">' + esc(value) + '</code><div class="rowTools"><button type="button" class="iconBtn copyValue" data-value="' + attr(value) + '">Copy</button>' + (SAFE_REPORT ? '' : '<button type="button" class="iconBtn rawOnly copyRaw" data-value="' + attr(f.match || '') + '">Raw</button>') + '</div></td>' +
            '<td><span class="lineNo">' + esc(f.line || '') + '</span></td>' +
            '<td><code class="ctx" title="' + attr(f.context || '') + '">' + esc(f.context || '') + '</code></td>' +
          '</tr>' +
          '<tr class="detailRow" id="' + detailId + '" hidden><td colspan="7" class="detailCell"><div class="detailPanel"><dl class="detailGrid">' +
            '<dt>File</dt><dd class="mono">' + esc(path) + '</dd>' +
            '<dt>Context</dt><dd class="mono">' + esc(f.context || '') + '</dd>' +
            '<dt>Evidence</dt><dd>' + esc(evidence || 'not available') + '</dd>' +
            '<dt>Validity</dt><dd>' + esc(f.validity || 'not_applicable') + '</dd>' +
          '</dl></div></td></tr>'
        );
      }
      tbody.innerHTML = rows.join('');
      visibleCount.textContent = String(filtered.length);
      loadedCount.textContent = String(DATA.length);
      renderPager(totalPages);
      paintSortIndicators();
    }

    function renderPager(totalPages){
      pager.innerHTML = '';
      function add(label, target, disabled){
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn';
        b.textContent = label;
        b.disabled = !!disabled;
        b.addEventListener('click', () => { page = target; render(); });
        pager.appendChild(b);
      }
      add('<<', 1, page === 1);
      add('<', Math.max(1, page - 1), page === 1);
      const label = document.createElement('span');
      label.className = 'statusLine';
      label.textContent = page + ' / ' + totalPages;
      pager.appendChild(label);
      add('>', Math.min(totalPages, page + 1), page === totalPages);
      add('>>', totalPages, page === totalPages);
    }

    function paintSortIndicators(){
      document.querySelectorAll('.sortdir').forEach(el => el.textContent = '');
      const active = document.querySelector('.sortButton[data-k="' + sortKey + '"] .sortdir');
      if(active) active.textContent = sortDir === 'asc' ? '^' : 'v';
    }

    function toCsv(rows){
      const escCsv = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
      const header = ['severity','file','rule','confidence','finding_class','validity','value','line','context','evidence'];
      const out = [header.map(escCsv).join(',')];
      rows.forEach(f => {
        const evidence = Array.isArray(f.evidence) ? f.evidence.join('; ') : (f.evidence || '');
        out.push([
          f.severity || '', f.file || '', f.rule || '', f.confidence || 0,
          f.finding_class || '', f.validity || '',
          (showRaw && !SAFE_REPORT) ? (f.match || '') : (f.redacted || ''),
          f.line || '', f.context || '', evidence
        ].map(escCsv).join(','));
      });
      return out.join('\r\n');
    }

    function downloadText(filename, text){
      const blob = new Blob([text], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function copyText(text){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => toast('Copied')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); toast('Copied'); } finally { ta.remove(); }
    }
    function toast(message){
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 1100);
    }

    tbody.addEventListener('click', event => {
      const copy = event.target.closest('.copyValue');
      if(copy){ event.stopPropagation(); copyText(copy.dataset.value || ''); return; }
      const raw = event.target.closest('.copyRaw');
      if(raw){ event.stopPropagation(); if(confirm('Copy raw secret?')) copyText(raw.dataset.value || ''); return; }
      const row = event.target.closest('.resultRow');
      if(row){
        const detail = document.getElementById(row.dataset.detail);
        if(detail) detail.hidden = !detail.hidden;
      }
    });

    document.querySelectorAll('.sortButton').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.dataset.k;
        if(sortKey === next){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
        else { sortKey = next; sortDir = next === 'file' || next === 'rule' ? 'asc' : 'desc'; }
        filtered = filtered.slice().sort(compare);
        render();
      });
    });

    q.addEventListener('input', applyFiltersDebounced);
    minScore.addEventListener('input', applyFilters);
    incGlob.addEventListener('input', applyFiltersDebounced);
    excGlob.addEventListener('input', applyFiltersDebounced);
    pageSize.addEventListener('change', () => { page = 1; render(); });
    if(toggleRawBtn){
      toggleRawBtn.addEventListener('click', () => {
        showRaw = !showRaw;
        toggleRawBtn.textContent = showRaw ? 'Hide Raw' : 'Show Raw';
        render();
      });
    }
    clearBtn.addEventListener('click', () => {
      q.value = '';
      incGlob.value = '';
      excGlob.value = '';
      minScore.value = '0';
      Object.keys(severityState).forEach(k => severityState[k] = true);
      document.querySelectorAll('[data-severity]').forEach(btn => btn.classList.add('active'));
      extState.forEach((_, k) => extState.set(k, true));
      ruleState.forEach((_, k) => ruleState.set(k, true));
      document.querySelectorAll('#extGroup .chipBtn,#ruleGroup .chipBtn').forEach(btn => btn.classList.add('active'));
      applyFilters();
    });
    exportFilteredBtn.addEventListener('click', () => downloadText(BASE_NAME + '_filtered.csv', toCsv(filtered)));
    document.addEventListener('keydown', event => {
      const tag = (event.target && event.target.tagName) || '';
      if(tag === 'INPUT' || tag === 'SELECT' || (event.target && event.target.isContentEditable)) return;
      const key = (event.key || '').toLowerCase();
      if(key === '/'){ event.preventDefault(); q.focus(); }
      else if(key === 'escape'){ clearBtn.click(); }
    });

    loadedCount.textContent = String(DATA.length);
    applyFilters();
  })();
  </script>
  <noscript>
    <div class="workbench" style="margin:16px">JavaScript is required to render this interactive report.</div>
  </noscript>
</body>
</html>
