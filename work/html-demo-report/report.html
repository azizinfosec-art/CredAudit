<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CredAudit Report</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#050806;
      --bg-grid:rgba(34,197,94,.055);
      --panel:#0b100d;
      --panel-2:#0f1713;
      --ink:#d8f8df;
      --muted:#7f9b89;
      --faint:#506357;
      --border:#1b3325;
      --border-hot:#2f6f4b;
      --code:#070b08;
      --chip:#0d1510;
      --green:#39ff88;
      --cyan:#22d3ee;
      --violet:#d946ef;
      --amber:#fbbf24;
      --rose:#fb3d67;
      --radius:8px;
      --shadow:0 18px 55px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.035);
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      background:
        linear-gradient(var(--bg-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
        linear-gradient(135deg, rgba(34,211,238,.06), transparent 34%, rgba(217,70,239,.045) 72%, transparent),
        var(--bg);
      background-size:22px 22px,22px 22px,auto,auto;
      color:var(--ink);
      font-family:var(--sans);
      font-size:14px;
      line-height:1.4;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:linear-gradient(transparent 96%, rgba(57,255,136,.08) 97%);
      background-size:100% 5px;
      opacity:.24;
      mix-blend-mode:screen;
    }
    a{color:inherit}
    button,input,select{font:inherit}
    .shell{position:relative;z-index:1;min-height:100vh;padding:16px;display:grid;gap:14px;align-content:start}
    .commandBar{
      display:grid;
      grid-template-columns:minmax(240px,1fr) auto;
      gap:14px;
      align-items:center;
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(15,23,19,.96),rgba(7,11,8,.96));
      box-shadow:var(--shadow);
      padding:14px;
    }
    .brandBlock{display:flex;gap:12px;align-items:center;min-width:0}
    .mark{
      width:38px;height:38px;border-radius:8px;border:1px solid rgba(57,255,136,.42);
      display:grid;place-items:center;font-family:var(--mono);font-weight:800;color:var(--green);
      background:linear-gradient(135deg,rgba(57,255,136,.12),rgba(34,211,238,.08));
      box-shadow:0 0 24px rgba(57,255,136,.16);
    }
    .brandText{min-width:0}
    .titleLine{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    h1{margin:0;font-size:19px;font-weight:800;letter-spacing:0;color:#f0fff3}
    .version,.modeBadge,.timeBadge{
      display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:999px;
      border:1px solid var(--border);background:var(--chip);font-size:12px;color:var(--muted)
    }
    .modeBadge.safe{color:var(--cyan);border-color:rgba(34,211,238,.38)}
    .modeBadge.raw{color:var(--amber);border-color:rgba(251,191,36,.42)}
    .byline{margin-top:3px;color:var(--muted);font-size:12px}
    .byline a{color:var(--green);text-decoration:none}
    .byline a:hover{text-decoration:underline}
    .metricGrid{display:grid;grid-template-columns:repeat(5,minmax(82px,1fr));gap:8px;min-width:520px}
    .metric{
      border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;background:rgba(13,21,16,.82);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);min-height:54px
    }
    .metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
    .metric strong{display:block;margin-top:2px;font-family:var(--mono);font-size:20px;color:#f3fff5}
    .metric.critical{border-color:rgba(251,61,103,.46)}
    .metric.critical strong{color:var(--rose)}
    .metric.high strong{color:var(--violet)}
    .metric.medium strong{color:var(--amber)}
    .metric.low strong{color:var(--cyan)}
    .mainGrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
    .sidebar,.workbench{
      border:1px solid var(--border);border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(15,23,19,.94),rgba(8,12,9,.94));
      box-shadow:var(--shadow);
    }
    .sidebar{position:sticky;top:14px;padding:12px;display:grid;gap:14px}
    .filterSection{display:grid;gap:8px}
    .sectionLabel{
      color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;
      display:flex;align-items:center;justify-content:space-between
    }
    .chipGroup{display:flex;flex-wrap:wrap;gap:7px;max-height:150px;overflow:auto;padding-right:2px}
    .chipBtn,.btn,.iconBtn{
      border:1px solid var(--border);border-radius:var(--radius);background:var(--chip);color:var(--ink);
      min-height:32px;padding:7px 10px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;
      text-decoration:none;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)
    }
    .chipBtn{font-size:12px;max-width:100%}
    .chipBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .chipBtn.active{border-color:var(--border-hot);box-shadow:0 0 0 1px rgba(57,255,136,.12),0 0 18px rgba(57,255,136,.10)}
    .chipBtn[data-severity="Critical"].active{border-color:rgba(251,61,103,.62);color:#ffe4ea;box-shadow:0 0 18px rgba(251,61,103,.16)}
    .chipBtn[data-severity="High"].active{border-color:rgba(217,70,239,.56);color:#fde6ff;box-shadow:0 0 18px rgba(217,70,239,.14)}
    .chipBtn[data-severity="Medium"].active{border-color:rgba(251,191,36,.56);color:#fff4cf;box-shadow:0 0 18px rgba(251,191,36,.12)}
    .chipBtn[data-severity="Low"].active{border-color:rgba(34,211,238,.56);color:#d8fbff;box-shadow:0 0 18px rgba(34,211,238,.12)}
    .btn:hover,.iconBtn:hover,.chipBtn:hover{border-color:var(--green)}
    .field{display:grid;gap:6px}
    .field input,.searchBox,select{
      width:100%;border:1px solid var(--border);border-radius:var(--radius);
      background:var(--code);color:var(--ink);min-height:34px;padding:8px 10px;outline:none
    }
    .field input:focus,.searchBox:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(57,255,136,.12)}
    .rangeRow{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center}
    input[type="range"]{accent-color:var(--green)}
    .scoreReadout{font-family:var(--mono);color:var(--green);text-align:right}
    .workbench{padding:12px;min-width:0}
    .toolbar{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}
    .toolbarActions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    .selectWrap{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
    .selectWrap select{width:auto;min-height:32px;padding:6px 26px 6px 8px}
    .tableFrame{
      border:1px solid var(--border);border-radius:var(--radius);overflow:auto;
      background:rgba(5,8,6,.74);max-height:calc(100vh - 215px);min-height:420px
    }
    table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
    col.sev{width:112px}
    col.file{width:31%}
    col.rule{width:190px}
    col.score{width:118px}
    col.value{width:150px}
    col.line{width:72px}
    col.context{width:30%}
    thead th{
      position:sticky;top:0;z-index:2;background:#0d1510;color:#b9d9c1;
      border-bottom:1px solid var(--border);padding:9px 8px;text-align:left;font-size:11px;
      text-transform:uppercase;letter-spacing:.08em
    }
    .sortButton{
      border:0;background:transparent;color:inherit;padding:0;cursor:pointer;display:inline-flex;gap:5px;align-items:center;
      text-transform:inherit;letter-spacing:inherit;font-size:inherit
    }
    tbody tr.resultRow{cursor:pointer}
    tbody tr.resultRow:hover{background:rgba(57,255,136,.045)}
    tbody td{border-bottom:1px solid rgba(27,51,37,.82);padding:9px 8px;vertical-align:middle}
    .detailRow[hidden]{display:none}
    .detailCell{padding:0 8px 10px 120px;background:rgba(57,255,136,.025)}
    .detailPanel{
      border:1px solid var(--border);border-radius:var(--radius);padding:10px;
      background:rgba(7,11,8,.82);display:grid;gap:8px
    }
    .detailGrid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:7px 12px;font-size:12px}
    .detailGrid dt{color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:.08em}
    .detailGrid dd{margin:0;min-width:0;word-break:break-word}
    .mono{font-family:var(--mono)}
    .severityBadge,.rulePill{
      display:inline-flex;align-items:center;max-width:100%;border-radius:999px;border:1px solid var(--border);
      padding:3px 8px;font-size:12px;line-height:1.2
    }
    .severityBadge{font-family:var(--mono)}
    .sev-Critical .severityBadge{border-color:rgba(251,61,103,.68);color:#ffe8ed;box-shadow:0 0 16px rgba(251,61,103,.16)}
    .sev-High .severityBadge{border-color:rgba(217,70,239,.62);color:#fee6ff}
    .sev-Medium .severityBadge{border-color:rgba(251,191,36,.62);color:#fff3c4}
    .sev-Low .severityBadge{border-color:rgba(34,211,238,.62);color:#d9fbff}
    .fileName{font-family:var(--mono);font-weight:700;color:#f0fff3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .filePath{font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
    .rulePill{font-family:var(--mono);font-size:11px;color:#dfffe7;background:rgba(57,255,136,.045);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .scoreCell{display:grid;gap:4px}
    .scoreTop{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono)}
    .scoreRail{height:6px;border-radius:999px;background:#162019;overflow:hidden;border:1px solid rgba(57,255,136,.12)}
    .scoreRail span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:999px}
    .sev-Critical .scoreRail span{background:linear-gradient(90deg,var(--rose),var(--violet))}
    code.val,code.ctx{
      display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      font-family:var(--mono);background:rgba(0,0,0,.24);border:1px solid rgba(27,51,37,.55);
      border-radius:6px;padding:4px 6px;color:#eaffed
    }
    .lineNo{font-family:var(--mono);color:var(--muted)}
    .rowTools{display:flex;gap:6px;margin-top:6px;opacity:0;transition:opacity .12s}
    tr:hover .rowTools{opacity:1}
    .iconBtn{min-height:26px;padding:4px 7px;font-size:11px}
    .footerBar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
    .pager{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .statusLine{font-size:12px;color:var(--muted)}
    .toast{
      position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
      border:1px solid var(--border-hot);border-radius:var(--radius);background:#08100b;color:var(--ink);
      padding:9px 12px;font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s;z-index:9
    }
    .toast.show{opacity:1}
    .safe-report .rawOnly{display:none}
    @media (max-width:1100px){
      .commandBar{grid-template-columns:1fr}
      .metricGrid{min-width:0;grid-template-columns:repeat(5,minmax(0,1fr))}
      .mainGrid{grid-template-columns:1fr}
      .sidebar{position:static}
      .tableFrame{max-height:none}
      .toolbar{grid-template-columns:1fr}
      .toolbarActions{justify-content:flex-start}
    }
    @media (max-width:720px){
      .shell{padding:10px}
      .metricGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .metric:first-child{grid-column:1/-1}
      col.file{width:260px}
      col.context{width:260px}
      .commandBar,.sidebar,.workbench{border-radius:8px}
    }
    @media print{
      body{background:#fff;color:#000}
      body::after,.sidebar,.toolbar,.footerBar{display:none}
      .shell{padding:0}
      .commandBar,.workbench,.tableFrame{box-shadow:none;border-color:#bbb;background:#fff}
      .tableFrame{max-height:none;overflow:visible}
      thead th{background:#eee;color:#000}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="commandBar">
      <div class="brandBlock">
        <div class="mark">CA</div>
        <div class="brandText">
          <div class="titleLine">
            <h1>CredAudit Report</h1>
            <span class="version">v0.6.0</span>
            <span class="modeBadge raw">raw enabled</span>
          </div>
          <div class="byline">by <a href="https://github.com/azizinfosec-art/CredAudit" target="_blank" rel="noopener">azizinfosec-art</a> <span class="timeBadge">2026-08-14 01:13:30</span></div>
        </div>
      </div>
      <div class="metricGrid" aria-label="Finding summary">
        <div class="metric"><span>Total</span><strong>6</strong></div>

        <div class="metric high"><span>High</span><strong>1</strong></div>
        <div class="metric medium"><span>Medium</span><strong>3</strong></div>
        <div class="metric low"><span>Low</span><strong>0</strong></div>
      </div>
    </header>

    <div class="mainGrid">
      <aside class="sidebar" id="filterPane">
        <section class="filterSection">
          <div class="sectionLabel">Severity</div>
          <div class="chipGroup" id="severityGroup">
            <button type="button" class="chipBtn active" data-severity="Critical"><span>Critical</span></button>
            <button type="button" class="chipBtn active" data-severity="High"><span>High</span></button>
            <button type="button" class="chipBtn active" data-severity="Medium"><span>Medium</span></button>
            <button type="button" class="chipBtn active" data-severity="Low"><span>Low</span></button>
          </div>
        </section>
        <section class="filterSection">
          <div class="sectionLabel"><span>Score</span><span class="scoreReadout" id="scoreReadout">0+</span></div>
          <div class="rangeRow">
            <input id="minScore" type="range" min="0" max="99" value="0" />
            <output class="scoreReadout" id="scoreOutput">0</output>
          </div>
        </section>
        <section class="filterSection">
          <div class="sectionLabel">File Types</div>
          <div class="chipGroup" id="extGroup"></div>
        </section>
        <section class="filterSection">
          <div class="sectionLabel">Rules</div>
          <div class="chipGroup" id="ruleGroup"></div>
        </section>
        <section class="filterSection">
          <div class="sectionLabel">Globs</div>
          <div class="field"><input id="incGlob" placeholder="include glob" /></div>
          <div class="field"><input id="excGlob" placeholder="exclude glob" /></div>
        </section>
      </aside>

      <main class="workbench">
        <div class="toolbar">
          <input id="q" class="searchBox" type="text" placeholder="Search findings" />
          <div class="toolbarActions">
            <label class="selectWrap">Rows
              <select id="pageSize">
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="250">250</option>
                <option value="500" selected>500</option>
              </select>
            </label>
            <button class="btn rawOnly" id="toggleRaw" type="button">Show Raw</button>
            <button class="btn" id="clear" type="button">Reset</button>
            <a class="btn" href="report.json" download>JSON</a>
            <a class="btn" href="report.csv" download>CSV</a>
            <button class="btn" id="exportFiltered" type="button">Export Filtered</button>
          </div>
        </div>

        

        <div class="tableFrame">
          <table id="tbl">
            <colgroup>
              <col class="sev" />
              <col class="file" />
              <col class="rule" />
              <col class="score" />
              <col class="value" />
              <col class="line" />
              <col class="context" />
            </colgroup>
            <thead>
              <tr>
                <th><button type="button" class="sortButton" data-k="severity">Severity <span class="sortdir"></span></button></th>
                <th><button type="button" class="sortButton" data-k="file">File <span class="sortdir"></span></button></th>
                <th><button type="button" class="sortButton" data-k="rule">Rule <span class="sortdir"></span></button></th>
                <th><button type="button" class="sortButton" data-k="confidence">Score <span class="sortdir"></span></button></th>
                <th>Value</th>
                <th><button type="button" class="sortButton" data-k="line">Line <span class="sortdir"></span></button></th>
                <th>Context</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="footerBar">
          <div class="statusLine"><span id="visibleCount">0</span> visible of <span id="loadedCount">0</span> loaded</div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  const DATA = [{"file": "C:\\Users\\Dell\\Documents\\GitHub\\CredAudit\\work\\html-demo\\client-creds.txt", "rule": "PasswordValueAssignment", "match": "Secret123!", "redacted": "Se****3!", "context": "password: Secret123!", "severity": "Critical", "line": 1, "confidence": 99, "finding_class": "likely", "validity": "not_applicable", "evidence": ["password keyword with explicit assignment", "value appears after a password/pass/pwd keyword", "context uses an assignment separator", "value has password-like complexity", "source file type commonly stores configuration or credentials"]}, {"file": "C:\\Users\\Dell\\Documents\\GitHub\\CredAudit\\work\\html-demo\\client-creds.txt", "rule": "CredentialPair", "match": "Root123!", "redacted": "R****!", "context": "admin:Root123!", "severity": "High", "line": 2, "confidence": 89, "finding_class": "likely", "validity": "not_applicable", "evidence": ["compact same-line username:password format", "line has no whitespace around the credential separator", "left side is username-like", "right side has password-like complexity", "source file is plain text", "source file is 5 MB or smaller", "filename suggests credential material", "file contains multiple credential-pair lines"]}, {"file": "C:\\Users\\Dell\\Documents\\GitHub\\CredAudit\\work\\html-demo\\client-creds.txt", "rule": "CredentialPair", "match": "base64", "redacted": "b****4", "context": "Content-Transfer-Encoding: base64", "severity": "Medium", "line": 3, "confidence": 69, "finding_class": "possible", "validity": "not_applicable", "evidence": ["compact same-line username:password format", "line has no whitespace around the credential separator", "left side looks like an HTTP/MIME metadata label, not a username", "source file is plain text", "source file is 5 MB or smaller", "filename suggests credential material", "file contains multiple credential-pair lines"]}, {"file": "C:\\Users\\Dell\\Documents\\GitHub\\CredAudit\\work\\html-demo\\client-creds.txt", "rule": "PasswordCandidate", "match": "mISX%%13402", "redacted": "mI****02", "context": "mISX%%13402", "severity": "Medium", "line": 4, "confidence": 58, "finding_class": "possible", "validity": "not_applicable", "evidence": ["standalone token has password-like shape", "token contains letters, digits, and complexity markers", "source file is plain text"]}, {"file": "C:\\Users\\Dell\\Documents\\GitHub\\CredAudit\\work\\html-demo\\service.env", "rule": "APIKeyGeneric", "match": "sk-abcde1234567890", "redacted": "sk-a****7890", "context": "api_key=sk-abcde1234567890", "severity": "Medium", "line": 1, "confidence": 70, "finding_class": "possible", "validity": "not_applicable", "evidence": ["generic API key prefix pattern"]}, {"file": "C:\\Users\\Dell\\Documents\\GitHub\\CredAudit\\work\\html-demo\\service.env", "rule": "PasswordValueAssignment", "match": "Backup456!", "redacted": "Ba****6!", "context": "password=Backup456!", "severity": "Critical", "line": 2, "confidence": 99, "finding_class": "likely", "validity": "not_applicable", "evidence": ["password keyword with explicit assignment", "value appears after a password/pass/pwd keyword", "context uses an assignment separator", "value has password-like complexity", "source file type commonly stores configuration or credentials"]}];
  const BASE_NAME = "report";
  const SAFE_REPORT = false;
  (function(){
    const tbody = document.querySelector('#tbl tbody');
    const q = document.getElementById('q');
    const pager = document.getElementById('pager');
    const pageSize = document.getElementById('pageSize');
    const minScore = document.getElementById('minScore');
    const scoreOutput = document.getElementById('scoreOutput');
    const scoreReadout = document.getElementById('scoreReadout');
    const extGroup = document.getElementById('extGroup');
    const ruleGroup = document.getElementById('ruleGroup');
    const incGlob = document.getElementById('incGlob');
    const excGlob = document.getElementById('excGlob');
    const visibleCount = document.getElementById('visibleCount');
    const loadedCount = document.getElementById('loadedCount');
    const toggleRawBtn = document.getElementById('toggleRaw');
    const clearBtn = document.getElementById('clear');
    const exportFilteredBtn = document.getElementById('exportFiltered');

    let showRaw = false;
    let page = 1;
    let filtered = DATA.slice();
    let sortKey = 'severity';
    let sortDir = 'desc';
    const severityState = {Critical:true, High:true, Medium:true, Low:true};
    const sevRank = {Critical:4, High:3, Medium:2, Low:1};
    const extState = new Map();
    const ruleState = new Map();
    const htmlMap = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'};

    function esc(value){ return String(value == null ? '' : value).replace(/[&<>"']/g, c => htmlMap[c]); }
    function attr(value){ return esc(value); }
    function clampScore(value){ const n = parseInt(value || 0, 10); return Math.max(0, Math.min(99, Number.isFinite(n) ? n : 0)); }
    function fileName(path){ const parts = String(path || '').split(/[\\/]/); return parts[parts.length - 1] || String(path || ''); }
    function fileDir(path){ const p = String(path || ''); const n = fileName(p); return n && p.length > n.length ? p.slice(0, -n.length).replace(/[\\/]$/, '') : ''; }
    function debounce(fn, ms){ let timer; return function(){ clearTimeout(timer); timer = setTimeout(fn, ms); }; }
    function globToReg(glob){
      const escaped = String(glob || '').replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.');
      return new RegExp('^' + escaped + '$','i');
    }
    function fuzzy(hay, needle){
      hay = String(hay || '').toLowerCase();
      needle = String(needle || '').toLowerCase();
      if(!needle) return true;
      let j = 0;
      for(let i=0;i<hay.length && j<needle.length;i++){ if(hay[i] === needle[j]) j++; }
      return j === needle.length;
    }

    function makeChip(label, stateMap, key){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chipBtn active';
      btn.title = label;
      btn.innerHTML = '<span>' + esc(label) + '</span>';
      btn.addEventListener('click', () => {
        const next = !stateMap.get(key);
        stateMap.set(key, next);
        btn.classList.toggle('active', next);
        applyFilters();
      });
      return btn;
    }

    Array.from(new Set(DATA.map(f => {
      const m = String(f.file || '').toLowerCase().match(/\.([a-z0-9]+)$/);
      return m ? m[1] : '';
    }))).filter(Boolean).sort().forEach(ext => {
      extState.set(ext, true);
      extGroup.appendChild(makeChip('.' + ext, extState, ext));
    });

    Array.from(new Set(DATA.map(f => f.rule || ''))).filter(Boolean).sort().forEach(rule => {
      ruleState.set(rule, true);
      ruleGroup.appendChild(makeChip(rule, ruleState, rule));
    });

    document.querySelectorAll('[data-severity]').forEach(btn => {
      btn.addEventListener('click', () => {
        const sev = btn.dataset.severity;
        severityState[sev] = !severityState[sev];
        btn.classList.toggle('active', severityState[sev]);
        applyFilters();
      });
    });

    function compare(a,b){
      let va, vb;
      if(sortKey === 'severity'){ va = sevRank[a.severity] || 0; vb = sevRank[b.severity] || 0; }
      else if(sortKey === 'confidence'){ va = clampScore(a.confidence); vb = clampScore(b.confidence); }
      else if(sortKey === 'line'){ va = parseInt(a.line || 0, 10) || 0; vb = parseInt(b.line || 0, 10) || 0; }
      else { va = String(a[sortKey] || '').toLowerCase(); vb = String(b[sortKey] || '').toLowerCase(); }
      if(va === vb){
        const sa = clampScore(a.confidence), sb = clampScore(b.confidence);
        if(sa !== sb) return sb - sa;
        return String(a.file || '').localeCompare(String(b.file || ''));
      }
      const result = va > vb ? 1 : -1;
      return sortDir === 'asc' ? result : -result;
    }

    function applyFilters(){
      const term = q.value.trim();
      const scoreFloor = clampScore(minScore.value);
      const inc = incGlob.value.split(/[,\s]+/).filter(Boolean).map(globToReg);
      const exc = excGlob.value.split(/[,\s]+/).filter(Boolean).map(globToReg);
      scoreOutput.textContent = String(scoreFloor);
      scoreReadout.textContent = scoreFloor + '+';
      filtered = DATA.filter(f => {
        const sev = f.severity || 'Low';
        if(!severityState[sev]) return false;
        if(clampScore(f.confidence) < scoreFloor) return false;
        const fp = String(f.file || '');
        const extMatch = fp.toLowerCase().match(/\.([a-z0-9]+)$/);
        const ext = extMatch ? extMatch[1] : '';
        if(ext && extState.has(ext) && !extState.get(ext)) return false;
        const rule = f.rule || '';
        if(ruleState.has(rule) && !ruleState.get(rule)) return false;
        if(inc.length && !inc.some(rx => rx.test(fp))) return false;
        if(exc.some(rx => rx.test(fp))) return false;
        if(!term) return true;
        return fuzzy(fp, term) || fuzzy(rule, term) || fuzzy(f.redacted || f.match || '', term) || fuzzy(f.context || '', term);
      }).sort(compare);
      page = 1;
      render();
    }
    const applyFiltersDebounced = debounce(applyFilters, 160);

    function render(){
      const size = parseInt(pageSize.value, 10) || 500;
      const totalPages = Math.max(1, Math.ceil(filtered.length / size));
      if(page > totalPages) page = totalPages;
      const start = (page - 1) * size;
      const end = Math.min(filtered.length, start + size);
      const rows = [];
      for(let i=start;i<end;i++){
        const f = filtered[i] || {};
        const sev = f.severity || 'Low';
        const score = clampScore(f.confidence);
        const path = String(f.file || '');
        const name = fileName(path);
        const dir = fileDir(path);
        const value = showRaw && !SAFE_REPORT ? (f.match || '') : (f.redacted || '');
        const evidence = Array.isArray(f.evidence) ? f.evidence.join('; ') : String(f.evidence || '');
        const detailId = 'detail-' + i;
        rows.push(
          '<tr class="resultRow sev-' + esc(sev) + '" data-detail="' + detailId + '">' +
            '<td><span class="severityBadge">' + esc(sev) + '</span></td>' +
            '<td><div class="fileName" title="' + attr(path) + '">' + esc(name) + '</div><div class="filePath" title="' + attr(path) + '">' + esc(dir) + '</div></td>' +
            '<td><span class="rulePill" title="' + attr(f.rule || '') + '">' + esc(f.rule || '') + '</span></td>' +
            '<td><div class="scoreCell"><div class="scoreTop"><span>' + score + '%</span><span>' + esc(f.finding_class || '') + '</span></div><div class="scoreRail"><span style="width:' + score + '%"></span></div></div></td>' +
            '<td><code class="val" title="' + attr(value) + '">' + esc(value) + '</code><div class="rowTools"><button type="button" class="iconBtn copyValue" data-value="' + attr(value) + '">Copy</button>' + (SAFE_REPORT ? '' : '<button type="button" class="iconBtn rawOnly copyRaw" data-value="' + attr(f.match || '') + '">Raw</button>') + '</div></td>' +
            '<td><span class="lineNo">' + esc(f.line || '') + '</span></td>' +
            '<td><code class="ctx" title="' + attr(f.context || '') + '">' + esc(f.context || '') + '</code></td>' +
          '</tr>' +
          '<tr class="detailRow" id="' + detailId + '" hidden><td colspan="7" class="detailCell"><div class="detailPanel"><dl class="detailGrid">' +
            '<dt>File</dt><dd class="mono">' + esc(path) + '</dd>' +
            '<dt>Context</dt><dd class="mono">' + esc(f.context || '') + '</dd>' +
            '<dt>Evidence</dt><dd>' + esc(evidence || 'not available') + '</dd>' +
            '<dt>Validity</dt><dd>' + esc(f.validity || 'not_applicable') + '</dd>' +
          '</dl></div></td></tr>'
        );
      }
      tbody.innerHTML = rows.join('');
      visibleCount.textContent = String(filtered.length);
      loadedCount.textContent = String(DATA.length);
      renderPager(totalPages);
      paintSortIndicators();
    }

    function renderPager(totalPages){
      pager.innerHTML = '';
      function add(label, target, disabled){
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn';
        b.textContent = label;
        b.disabled = !!disabled;
        b.addEventListener('click', () => { page = target; render(); });
        pager.appendChild(b);
      }
      add('<<', 1, page === 1);
      add('<', Math.max(1, page - 1), page === 1);
      const label = document.createElement('span');
      label.className = 'statusLine';
      label.textContent = page + ' / ' + totalPages;
      pager.appendChild(label);
      add('>', Math.min(totalPages, page + 1), page === totalPages);
      add('>>', totalPages, page === totalPages);
    }

    function paintSortIndicators(){
      document.querySelectorAll('.sortdir').forEach(el => el.textContent = '');
      const active = document.querySelector('.sortButton[data-k="' + sortKey + '"] .sortdir');
      if(active) active.textContent = sortDir === 'asc' ? '^' : 'v';
    }

    function toCsv(rows){
      const escCsv = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
      const header = ['severity','file','rule','confidence','finding_class','validity','value','line','context','evidence'];
      const out = [header.map(escCsv).join(',')];
      rows.forEach(f => {
        const evidence = Array.isArray(f.evidence) ? f.evidence.join('; ') : (f.evidence || '');
        out.push([
          f.severity || '', f.file || '', f.rule || '', f.confidence || 0,
          f.finding_class || '', f.validity || '',
          (showRaw && !SAFE_REPORT) ? (f.match || '') : (f.redacted || ''),
          f.line || '', f.context || '', evidence
        ].map(escCsv).join(','));
      });
      return out.join('\r\n');
    }

    function downloadText(filename, text){
      const blob = new Blob([text], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function copyText(text){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => toast('Copied')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); toast('Copied'); } finally { ta.remove(); }
    }
    function toast(message){
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 1100);
    }

    tbody.addEventListener('click', event => {
      const copy = event.target.closest('.copyValue');
      if(copy){ event.stopPropagation(); copyText(copy.dataset.value || ''); return; }
      const raw = event.target.closest('.copyRaw');
      if(raw){ event.stopPropagation(); if(confirm('Copy raw secret?')) copyText(raw.dataset.value || ''); return; }
      const row = event.target.closest('.resultRow');
      if(row){
        const detail = document.getElementById(row.dataset.detail);
        if(detail) detail.hidden = !detail.hidden;
      }
    });

    document.querySelectorAll('.sortButton').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.dataset.k;
        if(sortKey === next){ sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
        else { sortKey = next; sortDir = next === 'file' || next === 'rule' ? 'asc' : 'desc'; }
        filtered = filtered.slice().sort(compare);
        render();
      });
    });

    q.addEventListener('input', applyFiltersDebounced);
    minScore.addEventListener('input', applyFilters);
    incGlob.addEventListener('input', applyFiltersDebounced);
    excGlob.addEventListener('input', applyFiltersDebounced);
    pageSize.addEventListener('change', () => { page = 1; render(); });
    if(toggleRawBtn){
      toggleRawBtn.addEventListener('click', () => {
        showRaw = !showRaw;
        toggleRawBtn.textContent = showRaw ? 'Hide Raw' : 'Show Raw';
        render();
      });
    }
    clearBtn.addEventListener('click', () => {
      q.value = '';
      incGlob.value = '';
      excGlob.value = '';
      minScore.value = '0';
      Object.keys(severityState).forEach(k => severityState[k] = true);
      document.querySelectorAll('[data-severity]').forEach(btn => btn.classList.add('active'));
      extState.forEach((_, k) => extState.set(k, true));
      ruleState.forEach((_, k) => ruleState.set(k, true));
      document.querySelectorAll('#extGroup .chipBtn,#ruleGroup .chipBtn').forEach(btn => btn.classList.add('active'));
      applyFilters();
    });
    exportFilteredBtn.addEventListener('click', () => downloadText(BASE_NAME + '_filtered.csv', toCsv(filtered)));
    document.addEventListener('keydown', event => {
      const tag = (event.target && event.target.tagName) || '';
      if(tag === 'INPUT' || tag === 'SELECT' || (event.target && event.target.isContentEditable)) return;
      const key = (event.key || '').toLowerCase();
      if(key === '/'){ event.preventDefault(); q.focus(); }
      else if(key === 'escape'){ clearBtn.click(); }
    });

    loadedCount.textContent = String(DATA.length);
    applyFilters();
  })();
  </script>
  <noscript>
    <div class="workbench" style="margin:16px">JavaScript is required to render this interactive report.</div>
  </noscript>
</body>
</html>
