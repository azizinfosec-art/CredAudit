name: CredAudit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test*.py" -v

      - name: Run e2e tests
        run: python -m unittest discover -s tests/e2e -p "test*.py" -v

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CredAudit
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run CredAudit scan
        run: >
          credaudit scan -p .
          --full --safe
          --include-ext .py .yml .yaml .toml .md .txt .json .env
          --exclude-glob "**/tests/**"
          --exclude-glob "**/work/**"
          --exclude-glob "**/credaudit_out/**"
          --exclude-glob "**/credaudit/detection/rules.py"
          --only-rules PrivateKey AWSAccessKeyID AWSSecretAccessKey GitHubToken SlackWebhook AzureSAS StripeKey DBConnectionString GoogleAPIKey SlackToken SendGridKey GitLabPAT NpmToken OpenAIKey TelegramBotToken TwilioAccountSID TwilioAuthToken
          --formats sarif html json
          --no-timestamp --no-banner --no-cache

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('credaudit_out/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: credaudit_out/report.sarif

      - name: Upload CredAudit reports artifact
        if: always() && hashFiles('credaudit_out/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: credaudit-report
          path: credaudit_out/
